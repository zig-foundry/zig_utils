name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # Covers the "PR merger" case explicitly: a merged PR targeting main
  # produces both a push to main and a closed pull_request event. The
  # publish job below only runs when the PR was actually merged.
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # For a library we test on major platforms instead of cross-compiling binaries.
  # Pure Zig code has no platform-specific build artifacts to ship.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          # Always use the latest Zig master (nightly).
          # Matches the project's minimum_zig_version style and the request
          # for the latest master.
          version: master

      - name: Run tests
        run: zig build test --summary all

      # Build HTML docs only once (on Linux) so we can attach them to the release.
      - name: Build documentation
        if: runner.os == 'Linux'
        run: zig build docs

      - name: Upload docs artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: zig-out/docs/
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Run on pushes to main, on version tags, on merged PRs, and on manual
    # dispatch. Skip when a PR is closed without merging. Fork PRs are
    # skipped here because their GITHUB_TOKEN is read-only; the companion
    # push to main after the merge still publishes the release.
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download docs
        uses: actions/download-artifact@v4
        with:
          name: docs
          path: docs

      - name: Package source archive
        run: |
          mkdir -p dist
          # Clean source tarball suitable for zig fetch / manual use.
          # Excludes caches, git metadata, and build outputs.
          tar --exclude='.git' \
              --exclude='zig-cache' \
              --exclude='.zig-cache' \
              --exclude='zig-out' \
              --exclude='docs' \
              --exclude='dist' \
              --exclude='.github' \
              -czvf dist/zig-utils-source.tar.gz \
              --transform='s,^,zig-utils/,' \
              build.zig build.zig.zon src LICENSE README.md examples

      - name: Package docs
        run: |
          tar -czvf dist/zig-utils-docs.tar.gz -C docs .

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Move dev tag to current commit
        # softprops/action-gh-release reuses an existing tag as-is, so a
        # floating "dev" tag would keep pointing at its first commit forever.
        # Move it here so every main-branch push updates the dev release.
        if: github.ref_type != 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f dev ${{ github.sha }}
          git push origin -f refs/tags/dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Development Build' }}
          body: ${{ github.ref_type == 'tag' && '' || 'Automated development build from the latest main branch commit. This is a Zig library — consume via zig fetch or the attached source archive. Downloaded files are unsigned.' }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_type != 'tag' }}
          make_latest: ${{ github.ref_type == 'tag' && 'true' || 'false' }}
          generate_release_notes: ${{ github.ref_type == 'tag' }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

